<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YOYO 羽球隊 - T恤客製化預覽系統</title>
<style>
    /* 修正容器邊界問題的核心 */
    * { box-sizing: border-box; } /* 確保所有寬度計算包含邊框，防止撐開 */

    body {
        font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft JhengHei", sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        padding: 0; /* 改為 0，改由內部容器控制間距 */
        width: 100vw; /* 強制寬度等於視窗寬度 */
        overflow-x: hidden; /* 防止內容向右溢出導致左邊被切 */
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .main-container {
        display: flex;
        flex-direction: row;
        gap: 15px;
        max-width: 100%; /* 確保最大寬度不超過螢幕 */
        width: 100%;
        padding: 10px;   /* 提供內距，確保內容不會頂到螢幕邊緣 */
        justify-content: center;
        flex-wrap: wrap;
    }

    /* 確保畫布不會超出父容器 */
    .shirt-canvas {
        position: relative;
        width: 100%;
        max-width: 340px;
        margin: 0 auto; /* 自動置中 */
        aspect-ratio: 340 / 380;
        background-color: #ebeff2;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: visible; 
    }

    /* 調整手機端顯示縮放比例 */
    @media (max-width: 480px) {
        .main-container { padding: 5px; }
        .preview-area { padding: 5px; }
        h1 { font-size: 18px; padding: 10px; }
    }
</style>
</head>
<body>

    <h1>YOYO 羽球隊 排汗 T 模擬系統</h1>
    <div class="status-bar" id="statusBar">目前選擇：003 深灰色 / 白色印刷</div>

    <div class="main-container">
        
        <div class="preview-area">
            
            <div class="shirt-view">
                <div class="shirt-canvas" id="front-container">
                    <svg class="shirt-vector" viewBox="0 0 300 340">
                        <path class="shirt-part-fill" d="M90,40 C115,70 185,70 210,40 L295,85 C305,105 290,140 275,155 L235,120 L235,310 C235,325 65,325 65,310 L65,120 L25,155 C10,140 -5,105 5,85 Z" />
                        <path style="fill:none; stroke:rgba(0,0,0,0.25); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;" d="M90,40 C115,70 185,70 210,40" />
                    </svg>
                    
                    <div class="logo-layer front-logo" id="front-logo-container">
                        </div>
                </div>
                <h3>正面預覽</h3>
            </div>

            <div class="shirt-view">
                <div class="shirt-canvas" id="back-container">
                    <svg class="shirt-vector" viewBox="0 0 300 340">
                        <path class="shirt-part-fill" d="M90,40 C115,70 185,70 210,40 L295,85 C305,105 290,140 275,155 L235,120 L235,310 C235,325 65,325 65,310 L65,120 L25,155 C10,140 -5,105 5,85 Z" />
                        <path style="fill:none; stroke:rgba(0,0,0,0.25); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;" d="M90,40 C115,50 185,50 210,40" />
                    </svg>
                    
                    <div class="logo-layer back-logo" id="back-logo-container">
                        </div>
                </div>
                <h3>背面預覽</h3>
            </div>

        </div>

        <div class="control-panel">
            <div class="section-title">選擇印刷圖案顏色</div>
            <div class="toggle-container">
                <button class="btn-toggle active" id="btnLogoWhite" onclick="setLogoColor('#FFFFFF')">
                    <div class="color-dot" style="background: #fff;"></div> 白色
                </button>
                <button class="btn-toggle" id="btnLogoBlack" onclick="setLogoColor('#000000')">
                    <div class="color-dot" style="background: #000;"></div> 黑色
                </button>
            </div>

            <div class="section-title">選擇衣服顏色 (CP涼感排汗)</div>
            <div class="color-grid" id="colorGrid"></div>

            <div class="section-title">衣服尺寸表 (公分)</div>
            <div class="table-responsive">
                <table class="size-table">
                    <thead>
                        <tr><th>尺寸</th><th>#8</th><th>#10</th><th>XS</th><th>S</th><th>M</th><th>L</th><th>XL</th><th>2XL</th><th>3XL</th><th>5XL</th><th>7XL</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>胸寬</td><td>37</td><td>40</td><td>43</td><td>46</td><td>50</td><td>53</td><td>56</td><td>60</td><td>64</td><td>72</td><td>80</td></tr>
                        <tr><td>衣長</td><td>50</td><td>54</td><td>60</td><td>64</td><td>68</td><td>70</td><td>72</td><td>76</td><td>80</td><td>84</td><td>88</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 40 色資料庫
        const colorData = [
            { id: "001", name: "白色", hex: "#FFFFFF" }, { id: "002", name: "淺灰色", hex: "#B4B5B7" },
            { id: "003", name: "深灰色", hex: "#4A4E51" }, { id: "004", name: "黑色", hex: "#1A1A1A" },
            { id: "005", name: "粉紅色", hex: "#F3C0C9" }, { id: "006", name: "玫紅色", hex: "#E46882" },
            { id: "007", name: "紅色", hex: "#D61C23" }, { id: "008", name: "酒紅色", hex: "#722332" },
            { id: "009", name: "水藍色", hex: "#A9C9DC" }, { id: "010", name: "湖藍色", hex: "#0091CB" },
            { id: "011", name: "寶藍色", hex: "#005BAA" }, { id: "012", name: "丈青色", hex: "#1D2536" },
            { id: "013", name: "海藍色", hex: "#7FDDD6" }, { id: "014", name: "草綠色", hex: "#52C08A" },
            { id: "015", name: "墨綠色", hex: "#354E41" }, { id: "016", name: "卡其色", hex: "#D2C2A4" },
            { id: "017", name: "淺黃色", hex: "#FFF695" }, { id: "018", name: "黃色", hex: "#FFD300" },
            { id: "019", name: "淺紫色", hex: "#CDB4DB" }, { id: "020", name: "深紫色", hex: "#4A3B75" },
            { id: "021", name: "螢光粉", hex: "#FF66B2" }, { id: "022", name: "螢光橘", hex: "#FF6600" },
            { id: "023", name: "螢光綠", hex: "#33FF33" }, { id: "024", name: "螢光黃", hex: "#CCFF00" },
            { id: "025", name: "奶茶色", hex: "#E6D5C3" }, { id: "026", name: "蓮藕粉", hex: "#D1A3A4" },
            { id: "027", name: "玫瑰粉", hex: "#EAA2A6" }, { id: "028", name: "瑪瑙紅", hex: "#9E2A3B" },
            { id: "029", name: "芥末黃", hex: "#D1CD47" }, { id: "030", name: "金色", hex: "#E2A02B" },
            { id: "031", name: "南瓜橘", hex: "#F37023" }, { id: "032", name: "珊瑚橘", hex: "#FA5856" },
            { id: "033", name: "天空藍", hex: "#59B9E7" }, { id: "034", name: "薰衣草", hex: "#8A95CD" },
            { id: "035", name: "星空灰", hex: "#8C9BA5" }, { id: "036", name: "鯨魚藍", hex: "#1C5162" },
            { id: "037", name: "翡翠綠", hex: "#009B72" }, { id: "038", name: "軍綠", hex: "#627B66" },
            { id: "039", name: "駝色", hex: "#A8896C" }, { id: "040", name: "太妃糖", hex: "#7E583A" }
        ];

        const logoTargetColors = ['#000000', 'rgb(0,0,0)', 'rgb(0%,0%,0%)'];

        let currentShirtName = "003 深灰色";
        let currentLogoName = "白色印刷";

        // 初始化 40 色按鈕
        const colorGrid = document.getElementById('colorGrid');
        colorData.forEach((color) => {
            const item = document.createElement('div');
            item.className = `color-item ${color.id === '003' ? 'active' : ''}`;
            item.onclick = () => setShirtColor(color.hex, `${color.id} ${color.name}`, item);
            item.innerHTML = `<div class="color-swatch" style="background-color: ${color.hex}"></div><div class="color-name">${color.id}<br>${color.name}</div>`;
            colorGrid.appendChild(item);
        });

        function setShirtColor(hex, name, element) {
            document.documentElement.style.setProperty('--shirt-color', hex);
            currentShirtName = name;
            document.querySelectorAll('.color-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            updateStatus();
        }

        function setLogoColor(hex) {
            document.documentElement.style.setProperty('--logo-color', hex);
            currentLogoName = (hex === '#FFFFFF' ? "白色印刷" : "黑色印刷");
            
            const btnWhite = document.getElementById('btnLogoWhite');
            const btnBlack = document.getElementById('btnLogoBlack');
            
            if(hex === '#FFFFFF') {
                btnWhite.classList.add('active');
                btnBlack.classList.remove('active');
            } else {
                btnBlack.classList.add('active');
                btnWhite.classList.remove('active');
            }
            updateStatus();
        }

        function updateStatus() {
            document.getElementById('statusBar').innerText = `目前選擇：${currentShirtName} / ${currentLogoName}`;
        }

        // 智慧型向量線條變色綁定引擎
        function applyBindings() {
            const allElements = document.querySelectorAll('#front-logo-container *, #back-logo-container *');
            
            allElements.forEach(el => {
                el.classList.remove('logo-part-fill', 'logo-part-stroke');
                
                let elFill = el.getAttribute('fill');
                let elStroke = el.getAttribute('stroke');
                if (elFill) elFill = elFill.toLowerCase().replace(/\s+/g, '');
                if (elStroke) elStroke = elStroke.toLowerCase().replace(/\s+/g, '');
                
                const style = el.getAttribute('style');
                if (style) {
                    const fillMatch = style.replace(/\s+/g, '').match(/fill:([^;]+)/);
                    if (fillMatch) elFill = fillMatch[1].toLowerCase();
                    const strokeMatch = style.replace(/\s+/g, '').match(/stroke:([^;]+)/);
                    if (strokeMatch) elStroke = strokeMatch[1].toLowerCase();
                }

                if (logoTargetColors.includes(elFill)) el.classList.add('logo-part-fill');
                if (logoTargetColors.includes(elStroke)) el.classList.add('logo-part-stroke');
            });
        }

        const observer = new MutationObserver(applyBindings);
        const config = { childList: true, subtree: true };
        observer.observe(document.getElementById('front-logo-container'), config);
        observer.observe(document.getElementById('back-logo-container'), config);
        
        window.addEventListener('DOMContentLoaded', applyBindings);
    </script>
</body>
</html>
