<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOYO 羽球隊 - T恤客製化預覽系統</title>
    <style>
        :root {
            --shirt-color: #4A4E51; /* 預設 003 深灰色 */
            --logo-color: #FFFFFF;  /* 預設白色圖案 */
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #333; margin-bottom: 5px; }
        .status-bar { font-size: 16px; color: #555; margin-bottom: 20px; font-weight: bold; }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 900px;
            width: 95%;
			margin: 0 auto;
            justify-content: center;
            flex-wrap: wrap;
        }

       /* 預覽區域 */
        .preview-section {
            display: flex;
            gap: 15px; /* 將間距稍微縮小 */
            background: #fff;
            padding: 15px; /* 縮小內距，讓空間變多 */
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;       /* 改為 100% 寬度 */
            max-width: 600px;  /* 限制最大寬度，電腦上不會太寬 */
            min-width: unset;  /* 取消原本強制規定的 650px 限制 */
            justify-content: space-around;
            flex-wrap: wrap;   /* 關鍵：讓正反面在太窄時自動變成上下排列 */
            margin: 0 auto;    /* 居中 */
        }

        .shirt-view { text-align: center; }
        .shirt-view h3 { margin-top: 15px; color: #444; font-size: 18px; }

        /* 👕 衣服外框容器 */
        .shirt-wrapper {
            width: 320px;
            height: 380px;
            position: relative;
            background: #fdfdfd;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* 衣服底層圖層 */
        .shirt-base-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 衣服向量路徑變色 */
        .shirt-body {
            fill: var(--shirt-color);
            stroke: rgba(0,0,0,0.15);
            stroke-width: 1.5;
            transition: fill 0.3s ease;
        }
        .shirt-detail {
            fill: none;
            stroke: rgba(0,0,0,0.1);
            stroke-width: 2;
        }

        /* 🎯 LOGO 浮貼圖層（關鍵：在此進行完美定位與大小縮放） */
.logo-overlay {
    position: absolute;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

        /* 正面 LOGO 定位：左胸口 */
.front-logo-pos {
    top: 70px;
    right: 50px;
    width: 105px;
    height: 105px;
}
        /* 背面 LOGO 定位：大圖置中 */
.back-logo-pos {
    top: 10px;
    left: 55%;
    transform: translateX(-50%);
    width: 330px;
    height: 330px;
}

        /* 自動強制讓您放入的 SVG 填滿圖層，並連動顏色 */
        .logo-overlay svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 智慧連動：強制將您貼入的 SVG 內所有線條改為指定的印刷色 */
        .logo-overlay svg path,
        .logo-overlay svg circle,
        .logo-overlay svg polygon,
        .logo-overlay svg g {
            fill: var(--logo-color) !important;
            transition: fill 0.2s ease;
        }

        /* 右側控制面板 */
        .control-panel {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 450px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            border-left: 5px solid #005BAA;
            padding-left: 10px;
            color: #222;
        }

        /* 印刷顏色切換 */
        .logo-toggle { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-logo {
            flex: 1; padding: 12px; border: 2px solid #ddd; background: #fff; border-radius: 8px;
            cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-logo.active { border-color: #005BAA; background: #e6f2ff; color: #005BAA; }
        .color-dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid #ccc; }

        /* 40 衣服顏色網格 */
        .color-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
            margin-bottom: 20px; max-height: 320px; overflow-y: auto; padding-right: 5px;
        }
        .color-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 5px; border: 2px solid transparent; border-radius: 8px; }
        .color-item:hover { background: #f0f0f0; }
        .color-item.active { border-color: #005BAA; background: #eef6ff; }
        .swatch { width: 100%; height: 40px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }
        .c-name { font-size: 11px; margin-top: 5px; text-align: center; color: #555; }

        /* 尺寸表 */
        .size-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; margin-top: 10px; }
        .size-table th, .size-table td { border: 1px solid #eee; padding: 6px; }
        .size-table th { background: #f8f9fa; }
    </style>

        let currentShirtName = "003 深灰色";
        let currentLogoName = "白色印刷";

        // 初始化色格
        const colorGrid = document.getElementById('colorGrid');
        colorData.forEach(color => {
            const item = document.createElement('div');
            item.className = `color-item ${color.id === '003' ? 'active' : ''}`;
            item.onclick = () => setShirtColor(color.hex, `${color.id} ${color.name}`, item);
            item.innerHTML = `<div class="swatch" style="background-color: ${color.hex}"></div><div class="c-name">${color.id}<br>${color.name}</div>`;
            colorGrid.appendChild(item);
        });

        // 變更衣服顏色
        function setShirtColor(hex, name, element) {
            document.documentElement.style.setProperty('--shirt-color', hex);
            currentShirtName = name;
            document.querySelectorAll('.color-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            updateStatus();
        }

        // 變更 Logo 顏色
        function setLogoColor(hex) {
            document.documentElement.style.setProperty('--logo-color', hex);
            currentLogoName = (hex === '#FFFFFF' ? "白色印刷" : "黑色印刷");
            
            const btnWhite = document.getElementById('btnLogoWhite');
            const btnBlack = document.getElementById('btnLogoBlack');
            
            if(hex === '#FFFFFF') {
                btnWhite.classList.add('active');
                btnBlack.classList.remove('active');
            } else {
                btnBlack.classList.add('active');
                btnWhite.classList.remove('active');
            }
            updateStatus();
        }

        function updateStatus() {
            document.getElementById('statusBar').innerText = `目前選擇：${currentShirtName} / ${currentLogoName}`;
        }
    </script>
